[package]
name = "papervault"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight PDF and text file search & viewer for Windows 11"
license = "MIT"
repository = "https://github.com/IvanYang007/papervault"

[dependencies]
egui = "0.30"
eframe = "0.30"
tantivy = "0.22"
pdfium-render = "0.8"
pdf_oxide = { version = "0.3", default-features = false }
rayon = "1"
notify = { version = "7", features = ["macos_kqueue"] }
notify-debouncer-full = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
crossbeam = "0.8"
blake3 = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dirs-next = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = { version = "0.14", default-features = false, features = ["file-handle-inner"] }
walkdir = "2"
ureq = { version = "2", features = ["tls"] }

[dev-dependencies]
tempfile = "3"
printpdf = "0.7"
lopdf = "0.34"

[profile.release]
# Aggressive compile-speed tuning — binary size is not a concern.
lto = false         # no link-time optimization (biggest compile-time win)
codegen-units = 16  # max parallel LLVM codegen
debug = false       # skip debug info generation
debug-assertions = false
strip = true

[profile.dev]
# Faster debug builds: optimize dependencies mildly, skip debug info for deps
opt-level = 1
debug = 1

